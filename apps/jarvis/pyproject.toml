[project]
name = "arda"
dynamic = ["version"]
description = "Arda — macOS yerel sesli asistan"
requires-python = ">=3.11"

[project.scripts]
# `pip install -e .` sonrası: `arda` komutu == `python -m arda`
arda = "arda.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arda"]

[tool.setuptools.dynamic]
version = {attr = "arda.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

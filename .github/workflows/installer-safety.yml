name: Installer safety

on:
  push:
    branches: [main]
    paths:
      - "services/memory/**"
      - "apps/jarvis/install.sh"
      - "apps/jarvis/scripts/install_rpi_service.sh"
      - "Makefile"
      - ".github/workflows/installer-safety.yml"
  pull_request:
    paths:
      - "services/memory/**"
      - "apps/jarvis/install.sh"
      - "apps/jarvis/scripts/install_rpi_service.sh"
      - "Makefile"
      - ".github/workflows/installer-safety.yml"

permissions:
  contents: read

jobs:
  installer-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check installer shell syntax
        run: make check-shell
      - name: Check Shared Memory Pi installer safeguards
        working-directory: services/memory
        run: python -m unittest test_install_pi

name: Installer safety

on:
  push:
    branches: [main]
    paths:
      - "services/memory/**"
      - "apps/jarvis/install.sh"
      - "apps/jarvis/scripts/install_rpi_service.sh"
      - "Makefile"
      - ".github/workflows/installer-safety.yml"
  pull_request:
    paths:
      - "services/memory/**"
      - "apps/jarvis/install.sh"
      - "apps/jarvis/scripts/install_rpi_service.sh"
      - "Makefile"
      - ".github/workflows/installer-safety.yml"

permissions:
  contents: read

jobs:
  installer-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check installer shell syntax
        run: make check-shell
      - name: Check Shared Memory Pi installer safeguards
        working-directory: services/memory
        run: python -m unittest test_install_pi
